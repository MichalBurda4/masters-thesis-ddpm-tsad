seed: 42
device: cpu

data:
  name: yahoo
  csv_path: data/yahoo/A1Benchmark.csv
  train_ratio: 0.5
  window_size: 128
  stride: 10
  max_val_windows: 300
  max_test_windows: 500

model:
  channels: 1
  base_channels: 32
  timesteps: 100

train:
  epochs: 25
  batch_size: 32
  lr: 0.001
  early_stop_patience: 6

scoring:
  diffusion_steps: [25, 50, 75]

eval:
  threshold_method: f1
  pot_init_q: 0.98
  pot_train_max_windows: 150

paths:
  checkpoint_dir: checkpoints/yahoo
  output_dir: outputs/yahoo
  results_dir: results/yahoo
